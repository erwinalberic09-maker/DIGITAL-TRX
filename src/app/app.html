<router-outlet />

<!-- Conteneur global de notifications / toasts flottants -->
<div 
  id="global-notification-container"
  class="fixed top-4 right-4 z-50 flex flex-col gap-2.5 max-w-md w-full pointer-events-none px-4 sm:px-0"
  role="region"
  aria-label="Notifications système"
  aria-live="polite">
  
  @for (notif of notifications$ | async; track notif.id) {
    <div
      [id]="'notification-' + notif.id"
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-xl border shadow-lg backdrop-blur-md transition-all duration-300 animate-in fade-in slide-in-from-top-2"
      [class.bg-amber-50]="notif.type === 'warning'"
      [class.border-amber-200]="notif.type === 'warning'"
      [class.text-amber-900]="notif.type === 'warning'"
      [class.dark:bg-amber-950/80]="notif.type === 'warning'"
      [class.dark:border-amber-800/50]="notif.type === 'warning'"
      [class.dark:text-amber-200]="notif.type === 'warning'"
      
      [class.bg-rose-50]="notif.type === 'error'"
      [class.border-rose-200]="notif.type === 'error'"
      [class.text-rose-900]="notif.type === 'error'"
      [class.dark:bg-rose-950/80]="notif.type === 'error'"
      [class.dark:border-rose-800/50]="notif.type === 'error'"
      [class.dark:text-rose-200]="notif.type === 'error'"
      
      [class.bg-emerald-50]="notif.type === 'success'"
      [class.border-emerald-200]="notif.type === 'success'"
      [class.text-emerald-900]="notif.type === 'success'"
      [class.dark:bg-emerald-950/80]="notif.type === 'success'"
      [class.dark:border-emerald-800/50]="notif.type === 'success'"
      [class.dark:text-emerald-200]="notif.type === 'success'"
      
      [class.bg-blue-50]="notif.type === 'info'"
      [class.border-blue-200]="notif.type === 'info'"
      [class.text-blue-900]="notif.type === 'info'"
      [class.dark:bg-blue-950/80]="notif.type === 'info'"
      [class.dark:border-blue-800/50]="notif.type === 'info'"
      [class.dark:text-blue-200]="notif.type === 'info'"
      role="alert">
      
      <!-- Icône descriptive du type de notification -->
      <div class="shrink-0 mt-0.5">
        @switch (notif.type) {
          @case ('warning') {
            <mat-icon class="text-amber-600 dark:text-amber-400 !w-5 !h-5 !text-[20px]">warning</mat-icon>
          }
          @case ('error') {
            <mat-icon class="text-rose-600 dark:text-rose-400 !w-5 !h-5 !text-[20px]">error</mat-icon>
          }
          @case ('success') {
            <mat-icon class="text-emerald-600 dark:text-emerald-400 !w-5 !h-5 !text-[20px]">check_circle</mat-icon>
          }
          @default {
            <mat-icon class="text-blue-600 dark:text-blue-400 !w-5 !h-5 !text-[20px]">info</mat-icon>
          }
        }
      </div>

      <!-- Contenu textuel -->
      <div class="flex-1 min-w-0">
        @if (notif.title) {
          <h4 class="text-sm font-semibold leading-snug">{{ notif.title }}</h4>
        }
        <p class="text-xs mt-0.5 leading-relaxed opacity-90">{{ notif.message }}</p>
      </div>

      <!-- Bouton de fermeture -->
      <button
        type="button"
        [id]="'btn-dismiss-notif-' + notif.id"
        (click)="dismissNotification(notif.id)"
        class="shrink-0 p-1 rounded-lg opacity-70 hover:opacity-100 hover:bg-black/5 dark:hover:bg-white/10 transition-colors"
        aria-label="Fermer cette notification">
        <mat-icon class="!w-4 !h-4 !text-[16px] leading-none">close</mat-icon>
      </button>
    </div>
  }
</div>
